services:
  adguardhome:
    container_name: adguard
    image: adguard/adguardhome:latest
    dns:
      - 1.0.0.1
      - 1.1.1.1
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 8443:443
      - 853:853
      - 5443:5443
      - 8067:67/udp
      - 8068:68/udp
      - 8080:80/tcp
      - 3000:3000/tcp
      - 784:784/udp
      - 8853:8853/udp
    environment:
      TZ: America/Los_Angeles
    volumes:
      - /mnt/foxglove_storage/adguardhome/work:/opt/adguardhome/work
      - /mnt/foxglove_storage/adguardhome/conf:/opt/adguardhome/conf
    cap_add:
      - NET_BIND_SERVICE
    restart: always
    networks:
      network:
        ipv4_address: 172.19.0.2

  mysql:
    container_name: mysql
    image: mysql/mysql-server:latest
    command: --default-authentication-plugin=mysql_native_password --bind-address=172.18.0.3
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
    restart: always
    volumes:
      - /mnt/foxglove_storage/mysql/var/lib/mysql:/var/lib/mysql
    networks:
      network:
        ipv4_address: 172.19.0.3

  nginx_proxy_manager:
    container_name: nginx_proxy_manager
    image: jc21/nginx-proxy-manager:latest
    restart: always
    ports:
      - 80:80
      - 81:81
      - 443:443
    environment:
      DB_MYSQL_HOST: 172.19.0.3
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: ${MYSQL_NGINX_USERNAME}
      DB_MYSQL_PASSWORD: ${MYSQL_NGINX_PASSWORD}
      DB_MYSQL_NAME: nginx_proxy_manager
    volumes:
      - /mnt/foxglove_storage/nginx_proxy_manager/data:/data
      - /mnt/foxglove_storage/nginx_proxy_manager/letsencrypt:/etc/letsencrypt
    depends_on:
      - mysql
    networks:
      network:
        ipv4_address: 172.19.0.4

networks:
  network:
    ipam:
      driver: default
      config:
        - subnet: 172.19.0.0/16
